name: flowcept
services:
  flowcept_redis:
    container_name: flowcept_redis
    image: redis
    platform: ${FLOWCEPT_DOCKER_PLATFORM:-linux/amd64}
    ports:
      - 6379:6379

  flowcept_mongo:
    container_name: flowcept_mongo
    image: mongo:latest
    platform: ${FLOWCEPT_DOCKER_PLATFORM:-linux/amd64}
    env_file:
      - mongo.env
    ports:
      - 27017:27017
    volumes:
      - mongo_data:/data/db

networks:
  flowcept:
    driver: bridge

volumes:
  mongo_data:

# This is just for the cases where one does not want to use the same Redis instance for caching and messaging, but
